name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["swift:6.4.0"]

    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: swift build --build-tests

      - name: Run Tests
        run: swift test

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: "swift:6.4.0"
    steps:
      - uses: actions/checkout@v7
      - run: swift format lint -rps .

  build-embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: "swift:6.4.0"
    env:
      SWIFT_SDK_ID: swift-6.4.0-RELEASE_wasm-embedded
      WASM_SDK_URL: https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
      WASM_SDK_CHECKSUM: f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d

    steps:
      - uses: actions/checkout@v7

      - name: Install Swift WASM SDK
        run: swift sdk install ${{ env.WASM_SDK_URL }} --checksum ${{ env.WASM_SDK_CHECKSUM }}

      - run: swift build --swift-sdk ${{ env.SWIFT_SDK_ID }}

  bundled-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: "swift:6.4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Build runtime
        run: ./Scripts/build-runtime.sh

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Bundled runtime has uncommitted changes"
            echo "Please run './Scripts/build-runtime.sh' and commit the changes"
            git status
            git diff
            exit 1
          fi

  web-components-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SWIFT_VERSION: "6.4.0"
      WASM_SDK_URL: https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
      WASM_SDK_CHECKSUM: f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
          skip-verify-signature: true
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: IntegrationTests/WebComponents/pnpm-lock.yaml
      - name: Install Swift WASM SDK
        run: swift sdk install ${{ env.WASM_SDK_URL }} --checksum ${{ env.WASM_SDK_CHECKSUM }}
      - name: Install dependencies
        working-directory: IntegrationTests/WebComponents
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: IntegrationTests/WebComponents
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser integration tests
        working-directory: IntegrationTests/WebComponents
        run: pnpm test
