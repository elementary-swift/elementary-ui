name: Build Examples

on:
  push:
    branches: [main]
    paths:
      - "**.swift"
      - "**.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        swift:
          - image: swift:6.4.0
            wask-sdk-url: https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
            wasm-sdk-checksum: f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
        examples:
          - Examples/Swiftle
          - Examples/Basic
    container: ${{ matrix.swift.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: ${{ matrix.examples }}/pnpm-lock.yaml

      - name: Install Swift WASM SDK
        run: swift sdk install ${{ matrix.swift.wask-sdk-url }} --checksum ${{ matrix.swift.wasm-sdk-checksum }}

      - name: Install dependencies
        working-directory: ${{ matrix.examples }}
        run: swift package resolve && pnpm install

      - name: Build
        working-directory: ${{ matrix.examples }}
        run: pnpm build
